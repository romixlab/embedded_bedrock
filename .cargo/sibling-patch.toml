# Co-development with the sibling WireWeaver checkout (../wire_weaver): `just dev-local` copies this file to
# .cargo/dev-local.toml (gitignored, included by .cargo/config.toml), so builds here take WireWeaver from the sibling
# and a change there is picked up at once; `just dev-git` removes it again. Cargo does not read this file by itself.
# Committed builds never see it: Cargo.toml takes WireWeaver by git, pinned to a commit in Cargo.lock.
# While it is active Cargo.lock names the sibling paths instead of the git commit: never commit the lock in that
# state (the --locked gate refuses it). exact_units (pulled by ww_si) names shrink_wrap by the same git source:
# without its line here it brings a second shrink_wrap (E0277 in ww_si).
[patch."https://github.com/vhrdtech/wire_weaver"]
shrink_wrap = { path = "../wire_weaver/shrink_wrap/shrink_wrap" }
wire_weaver = { path = "../wire_weaver/wire_weaver" }
ww_can_bus = { path = "../wire_weaver/ww_stdlib/ww_can_bus" }
ww_clock_sync = { path = "../wire_weaver/ww_clock_sync" }
ww_date_time = { path = "../wire_weaver/ww_stdlib/ww_date_time" }
ww_dfu = { path = "../wire_weaver/ww_stdlib/ww_dfu" }
ww_indication = { path = "../wire_weaver/ww_stdlib/ww_indication" }
ww_si = { path = "../wire_weaver/ww_stdlib/ww_si" }
ww_timebase = { path = "../wire_weaver/ww_stdlib/ww_timebase" }
ww_version = { path = "../wire_weaver/ww_stdlib/ww_version" }
