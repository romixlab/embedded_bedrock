# B135 FDCAN ISO USB: an isolated USB high speed to CAN FD adapter. Rev B is the base; rev A is a patch over it.
# Facts: the B135A and B135B KiCad boards (hw/b135_fdcan_iso_usb/source/b135a, b135b), the template's B135B preset
# and board map (firmware_template_skill/scripts/data/boards/b135b), vb135_fdcan_iso_usb_fw (b135_fw, b135_board),
# DS13311 (STM32H725xE/G).

[board]
name = "B135"
chip = "STM32H725IG"                  # U201 STM32H725IGK6, 1 MiB flash in one bank
package = "UFBGA176"                  # TFBGA176+25 on the board; stm32-data calls the K package UFBGA176
mcu = "U201"
pcb = "../../../../firmware_template_skill/scripts/data/boards/b135b/b135b.geometry.json"
revisions = ["A", "B"]

[reserved.swd]
pins = ["PA13", "PA14"]
note = "SWD on the Tag-Connect J202 (TC2050): SWDIO J202-2, SWCLK J202-4"

[periph.hse]
instance = "RCC"
pins = { OSC_IN = { pin = "PH0", net = "H7_CLK" } }
note = "the 24 MHz oscillator X301 in bypass, through R216 (49R9); X301 also clocks the USB3315. PH1 is not connected."

[periph.lse]
instance = "RCC"
pins = { OSC32_IN = "PC14", OSC32_OUT = "PC15" }
note = "32.768 kHz crystal X201; VBAT from the CR1632 holder B201 through D202"

# J301 USB-C through the TS3USB221A mux U301: high speed on the USB3315 ULPI PHY U303, full speed on PA11 / PA12
# (the ROM bootloader's DFU)
[periph.usb_hs]
instance = "USB_OTG_HS"
pins = { ULPI_CK = "PA5", ULPI_D0 = "PA3", ULPI_D1 = "PB0", ULPI_D2 = "PB1", ULPI_D3 = "PB10", ULPI_D4 = "PB11", ULPI_D5 = "PB12", ULPI_D6 = "PB13", ULPI_D7 = "PB5", ULPI_STP = "PC0", ULPI_DIR = "PC2", ULPI_NXT = "PC3" }
note = "stm32-data has PC3 and PH4 for ULPI_NXT; the board has PC3"

[periph.usb_fs]
instance = "USB_OTG_HS"
pins = { DM = { pin = "PA11", net = "D_FS-" }, DP = { pin = "PA12", net = "D_FS+" }, VBUS = { pin = "PA9", net = "USB_VBUS_DET" } }
note = "the mux's full speed side, J301 while PH5 is high (R305 pulls it so at reset); VBUS through R303 (10k), D303 (5V6) clamps it"

[gpio.ulpi_rst]
pin = { pin = "PH3", net = "~{ULPI_RST}" }
mode = "output"
init = "high"
note = "the USB3315's RESETB: R312 holds the PHY in reset until the firmware drives it high"

[gpio.usb_mux_hs]
pin = { pin = "PH5", net = "~{USB_MUX_HS}" }
mode = "output"
init = "low"
note = "the TS3USB221A's select: low connects J301 to the ULPI PHY, R305 pulls it to PA11 / PA12 at reset"

# FDCAN1 to the isolated transceiver ADM3050E U501 (no standby pin) and the DE-9 J501; FDCAN3 bare on J203
[periph.can1]
instance = "FDCAN1"
pins = { TX = { pin = "PB9", net = "FDCAN1_TX" }, RX = { pin = "PB8", net = "FDCAN1_RX" } }
note = "ADM3050E U501, isolated"

[periph.can3]
instance = "FDCAN3"
pins = { TX = "PG9", RX = "PD12" }
note = "3.3 V logic TX and RX on J203-3 / J203-4, no transceiver"

[gpio.term_en]
pin = { pin = "PC13", net = "TERM_EN" }
mode = "output"
init = "low"
note = "sets the latching relay K501 (120 R termination on): a pulse high of 20 ms"

[gpio.term_dis]
pin = { pin = "PE4", net = "TERM_DIS" }
mode = "output"
init = "low"
note = "resets the latching relay K501 (termination off): a pulse high of 20 ms"

[short.j203_3]
pins = ["PG9", "PB3"]
note = "J203-3: PB3 stays an input (JTDO at reset, driven only by JTAG)"

[short.j203_4]
pins = ["PD12", "PA7"]
note = "J203-4: PA7 stays an input (analog at reset)"

[short.j203_7]
pins = ["PB4", "PB7"]
note = "J203-7: PB4 is the free one (NJTRST at reset, internal pull-up), PB7 stays an input"

[led.status]
rgb = [{ pin = "PC7", net = "LED_R" }, { pin = "PC6", net = "LED_G" }, { pin = "PH13", net = "LED_B" }]
active = "low"
note = "D201, common anode on +3V3: R202 (130R), R203 (33R), R204 (33R). TIM3 CH2, TIM3 CH1, TIM8 CH1N"

[button.boot0]
pin = { pin = "PE1", net = "BOOT0" }
active = "high"
pull = "none"
note = "SW201 pulls BOOT0 to +3V3, R220 (10k) to GND; also J202-8"

[periph.sd]
instance = "SDMMC1"
pins = { CK = "PC12", CMD = "PD2", D0 = "PC8", D1 = "PC9", D2 = "PC10", D3 = "PC11" }
note = "the microSD slot J201"

[gpio.sd_present]
pin = { pin = "PG4", net = "SDMMC_PRESENT" }
mode = "input"
pull = "none"
note = "J201's card detect switch, R205 (10k) pull-up"

[gpio.rid_en]
pin = { pin = "PB14", net = "RID_EN" }
mode = "output"
init = "low"
note = "powers the board id dividers while they are read"

[periph.rid]
instance = "ADC2"
pins = { INP2 = { pin = "PF13", net = "RID_VARIANT" }, INP6 = { pin = "PF14", net = "RID_BOM" } }
note = "board id dividers: variant and bill of materials, fed from PB14"

[gpio.supply_5v0]
pin = { pin = "PC5", net = "5V0_DIV" }
mode = "analog"
note = "+5V0_SYS through R408 / R409 (half)"

[free]
PE0 = "J203-5"
PA8 = "MCO1 on the test point TP202"
PA0_C = "J203-2, analog only (ADC1 INP0)"
PA1_C = "J203-1, analog only (ADC1 INP1)"

# Rev A: two RGB LEDs (CAN and SD) instead of one, no FDCAN3, no BOOT0 read, nothing on J203's GPIOs
[rev.A]
pcb = "b135a-mcu.geometry.json"
note = "B135A: CAN LED on PC7 / PC6 / PA10, SD LED on PD14 / PD13 / PD12 (TIM4); no FDCAN3, no BOOT0 on PE1"
remove = ["led.status", "periph.can3", "short.j203_3", "short.j203_4", "short.j203_7", "button.boot0", "free.PE0", "free.PA0_C", "free.PA1_C"]

[rev.A.led.can]
rgb = [{ pin = "PC7", net = "LED_CAN_R" }, { pin = "PC6", net = "LED_CAN_G" }, { pin = "PA10", net = "LED_CAN_B" }]
active = "low"

[rev.A.led.sd]
rgb = [{ pin = "PD14", net = "LED_SD_R" }, { pin = "PD13", net = "LED_SD_G" }, { pin = "PD12", net = "LED_SD_B" }]
active = "low"
