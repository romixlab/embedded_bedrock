# A pin used twice, a free pin in use, both pins of a short used.
[board]
name = "T5"
chip = "STM32TEST"

[periph.can]
instance = "FDCAN1"
pins = { RX = "PA0", TX = "PA1" }

[gpio.reset]
pin = "PA0"
mode = "output"
init = "low"

[button.user]
pin = "PB0"
active = "low"
pull = "up"

[short.j1_3]
pins = ["PB0", "PB1"]

[free]
PB1 = "J1-3"
PA1 = "J1-4"
