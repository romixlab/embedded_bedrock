# Against a PCB: a pin not connected, a wrong net, shared nets without a short, a short across two nets.
[board]
name = "T7"
chip = "STM32TEST"
mcu = "U1"
pcb = "t7.json"

[periph.can]
instance = "FDCAN1"
pins = { RX = { pin = "PA0", net = "CAN_RX" }, TX = { pin = "PA1", net = "CAN_RX" } }

[led.status]
pin = "PB0"
active = "low"

[short.pair]
pins = ["PB1", "PC0"]

[free]
PA0_C = "J1-1"
