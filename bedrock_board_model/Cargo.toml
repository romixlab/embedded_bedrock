[package]
name = "bedrock_board_model"
version = "0.1.0"
edition = "2024"
description = "Board description (board.toml): schema, loading with source spans, revisions and reworks as patches"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
