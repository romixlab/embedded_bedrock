[package]
name = "bedrock_usb"
version = "0.1.0"
edition = "2024"
description = "USB device stack for STM32, fixed at compile time, full and high speed: shared types, descriptors as const fn output, the endpoint and USB SRAM or FIFO layout with const asserts, the EP0 control machine, the usb_v4 driver with its usb_v3 port, the Synopsys OTG driver"
license = "MIT OR Apache-2.0"

[features]
defmt = ["dep:defmt"]
# The simulated usb_v4 peripheral (`v4::sim`) and OTG core (`otg::sim`), std, for host tests of code built on the drivers
sim = []
# embassy-stm32 glue: the typelevel interrupt handler for `bind_interrupts!`, `Peri<USB>`, the RCC enable. The
# firmware's embassy-stm32 names the chip; `unstable-pac` gives the peripheral's addresses.
embassy-stm32 = ["dep:embassy-stm32"]
# embassy-stm32 glue for the OTG driver on the STM32H72x / H73x USB1 OTG_HS (`otg::embassy`): `Peri<USB_OTG_HS>`,
# the interrupt handler, the USB supply, the ULPI or full-speed pins. Separate from `embassy-stm32`, whose usb_v4 glue
# needs a chip with that peripheral; the firmware's embassy-stm32 names the chip.
embassy-stm32-otg = ["dep:embassy-stm32"]
# With embassy-stm32 on an STM32F1: embassy maps pins through AFIO there and its USB pin traits have no
# alternate-function number, so `v1::embassy::new` leaves DP / DM alone (the F1 connects them by itself)
stm32f1 = ["embassy-stm32"]
# Test only: tests/v4_metapac.rs holds the driver's registers to stm32-metapac's G0B1. A feature, not a
# dev-dependency, because a workspace build unifies dev-dependency features and metapac takes one chip per build
# (bedrock_clocks_rt's tests take the H725); `just test` runs it in a `-p bedrock_usb` pass of its own.
metapac-check = ["dep:stm32-metapac", "stm32-metapac/stm32g0b1re"]
# Test only: tests/v3_metapac.rs, the same for usb_v3 against the STM32G474's metapac. Not together with
# metapac-check (one chip per build): `just test` runs each in its own pass.
metapac-check-v3 = ["dep:stm32-metapac", "stm32-metapac/stm32g474re"]

[dependencies]
critical-section = "1.2"
defmt = { version = "1.0", optional = true }
embassy-stm32 = { version = "0.6.0", default-features = false, features = ["unstable-pac"], optional = true }
# the same metapac embassy-stm32 0.6 resolves
stm32-metapac = { version = "21.0.0", default-features = false, features = ["pac"], optional = true }

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
# asm::delay for the tSTARTUP and ES0548 2.16.1 waits
cortex-m = "0.7"

[dev-dependencies]
# the golden test: Donguru's descriptor set as embassy-usb's Builder writes it, read back through a dummy driver
embassy-usb = { version = "0.6.0", default-features = false }
embassy-futures = "0.1.2"
critical-section = { version = "1.2", features = ["std"] }
# tests/otg_regs.rs: the OTG offsets and bits against otg_v1; the version embassy-stm32 0.6 resolves
embassy-usb-synopsys-otg = { version = "0.3.3", default-features = false }

[[test]]
name = "v4_metapac"
required-features = ["metapac-check"]

[[test]]
name = "v3_metapac"
required-features = ["metapac-check-v3"]
