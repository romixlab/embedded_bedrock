[package]
name = "f103_loopback"
version = "0.1.0"
edition = "2024"
description = "bedrock_usb example on usb_v1: a vendor bulk loopback on the STM32F103 (blue pill), WinUSB through MS OS 2.0"
license = "MIT OR Apache-2.0"
publish = false

# standalone firmware crate for thumbv7m-none-eabi: keeps the embedded_bedrock workspace from claiming it
[workspace]

[dependencies]
bedrock_usb = { path = "../..", features = ["embassy-stm32", "stm32f1", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32f103c8", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2.1"

[profile.release]
codegen-units = 1
debug = 2               # debug info does not end up in flash; the size measurement reads its line table
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"         # `just lint` builds it at 3 too (CARGO_PROFILE_RELEASE_OPT_LEVEL)
overflow-checks = false
