[package]
name = "h725_loopback"
version = "0.1.0"
edition = "2024"
description = "bedrock_usb example: a high-speed vendor bulk loopback on the STM32H725 OTG_HS over ULPI, WinUSB through MS OS 2.0"
license = "MIT OR Apache-2.0"
publish = false

# standalone firmware crate for thumbv7em-none-eabihf: keeps the embedded_bedrock workspace from claiming it
[workspace]

[dependencies]
bedrock_usb = { path = "../..", features = ["embassy-stm32-otg", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32h725ig", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2.1"

[profile.release]
codegen-units = 1
debug = 2               # debug info does not end up in flash; the size measurement reads its line table
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"         # `just lint` builds it at 3 too (CARGO_PROFILE_RELEASE_OPT_LEVEL)
overflow-checks = false
