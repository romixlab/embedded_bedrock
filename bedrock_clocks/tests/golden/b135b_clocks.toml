# B135 rev B clock plan (sketch of the RCC-2 format; the test only hashes this file)
part = "STM32H725IGK6"
vdd = "3.3 V"
supply = "direct-smps"
vos = 1                         # VOS0 is ~2 years at TJ 105 °C busy (AN5337 Rev 4 §7)

[hse]
freq = "24 MHz"
mode = "bypass"                 # X301, shared with the USB3315 ULPI PHY

[pll]
source = "hse"

[pll1]                          # 8 MHz × (99 + 4096/8192) = 796 MHz VCO, P 398 MHz
m = 3
n = 99
fracn = 4096
p = 2
q = 8
steer = "±100 ppm"

[pll2]                          # 4.8 MHz × (166 + 5461/8192) = 799.9998046875 MHz VCO
m = 5
n = 166
fracn = 5461
q = 10                          # FDCAN 79.99998046875 MHz (−0.244140625 ppm)
r = 8                           # SDMMC 99.9999755859375 MHz
steer = "±100 ppm"

[pll3]                          # 8 MHz × 96 = 768 MHz VCO, integer mode
m = 3
n = 96
p = 8
q = 16                          # USB 48 MHz
r = 16                          # ADC 48 MHz

[sys]
source = "pll1_p"
d1cpre = 1
hpre = 2
d1ppre = 2
d2ppre1 = 2
d2ppre2 = 2
d3ppre = 2

[kernel]
fdcan = "pll2_q"
sdmmc = "pll2_r"
usb = "pll3_q"
adc = "pll3_r"

[expect]
usb = "48 MHz"
fdcan = { freq = "80 MHz", tolerance = "1 ppm" }
