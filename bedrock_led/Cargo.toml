[package]
name = "bedrock_led"
version = "0.1.0"
edition = "2024"
description = "Status LED animation for bedrock firmware: breath and blink with eased fades, gamma, peak brightness, identify; mono and RGB LEDs over embedded-hal PWM"
license = "MIT OR Apache-2.0"

# The `ww-indication` feature takes ww_indication from WireWeaver's git (the workspace dependencies); firmware that
# builds against a local WireWeaver checkout points that git source at it with a [patch], so both resolve to the
# same ww_indication.

[features]
# The async driver: shared state in statics, the task loop on embassy-time and embassy-sync. Off: the HAL-free
# core only (host tests, board crates shared with a simulator)
embassy = ["dep:embassy-time", "dep:embassy-sync"]
# The ww_indication::Indication bookkeeping shared by boards (brightness peaks, identify busy and cap)
ww-indication = ["dep:ww_indication"]
defmt = ["dep:defmt", "ww_indication?/defmt"]

[dependencies]
defmt = { version = "1.0", optional = true }
embedded-hal = "1.0"
embassy-sync = { version = "0.8.0", optional = true }
embassy-time = { version = "0.5.1", optional = true }
ww_indication = { workspace = true, optional = true }
