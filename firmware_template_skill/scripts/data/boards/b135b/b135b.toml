to = "5v"

[[power.edge]]
from = "bus"
to = "u601"

[[power.edge]]
from = "u601"
to = "5v"
label = "D604"

[[power.edge]]
from = "5v"
to = "u402"

[[power.edge]]
from = "5v"
to = "u302"

[[power.edge]]
from = "5v"
