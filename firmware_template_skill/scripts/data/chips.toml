# Built-in (non-STM32) chips. STM32 parts are looked up in embassy-rs/stm32-data-generated instead.
#
# Table key = --chip value (lower case, also the HAL feature unless hal_feature is set).
# Sizes accept K/M suffixes. `led` is the default --led pin.
# ESP chips have no flash/rams: esp-hal's linkall.x handles the memory layout.

[rp2040]
display = "RP2040"
family = "rp"
arch = "arm"
rust_target = "thumbv6m-none-eabi"
probe_chip = "RP2040"
led = "PIN_25"
rp_variant = "rp2040"
boot2 = true  # second stage bootloader in the first 256 bytes of flash
flash = { address = 0x10000000, size = "2M", erase = "4K", write = 256 }
rams = [
  { name = "RAM", address = 0x20000000, size = "264K" },
]

[rp2350]
display = "RP2350"
family = "rp"
arch = "arm"
rust_target = "thumbv8m.main-none-eabihf"
probe_chip = "RP235x"
led = "PIN_25"
rp_variant = "rp235xa"
flash = { address = 0x10000000, size = "4M", erase = "4K", write = 256 }
rams = [
  { name = "RAM", address = 0x20000000, size = "512K" },
  { name = "SRAM8", address = 0x20080000, size = "4K" },
  { name = "SRAM9", address = 0x20081000, size = "4K" },
]

