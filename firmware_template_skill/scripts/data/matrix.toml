# Tested matrix (TPL-44): the fenced block in ../../references/frameworks.md#tested-matrix, as data for the
# `matrix` subcommand of bedrock_gen.py. Keep the two in sync: a chip/option combination added to one belongs in
# the other. `name` becomes the scratch directory and the generated package name; it must be unique here even
# where frameworks.md's prose reuses a name across its two sections (see rp2040w below).
#
# Per entry:
#   args    extra argv for `new <name> --out <dir> <args...>` (no --bedrock/--ww-src: the matrix command injects
#           them from its own --bedrock/--ww-src unless the entry is tagged "git").
#   builds  subset of dev | release | bootloader | bootloader-nodefmt | api-evolve, run after generation:
#             dev, release       cargo build [--release] in the app crate (firmware/ with --wire-weaver)
#             bootloader         cd bootloader && cargo build --features defmt
#             bootloader-nodefmt cd bootloader && cargo build (default features: compact() build-info only,
#                                see bedrock_build; only meaningful for --build-info entries, which test both)
#             api-evolve         TPL-52, --wire-weaver on an STM32 with a [variant] table (needs ww): the API
#                                generated again with one more silicon revision passes `ww api check` against the
#                                first one's snapshot as a compatible change, one put in front fails as breaking
#   tags    subset of ww | host | git | rtt, for `--tag`:
#             ww    --wire-weaver (needs --ww-src; crash capture needs --bedrock on every Cortex-M entry regardless)
#             rtt   --ww-transport rtt
#             git   deliberately keeps --bedrock/--ww-src at their "git" default (not overridden): at least one
#                   entry per release must build against the real git sources, not a sibling checkout (TPL-43:
#                   the API crate then needs `cargo generate-lockfile` first, which the matrix command does for
#                   any "git"-tagged --wire-weaver entry)
#             host  --host (TPL-37): cargo test + clippy --all-targets -- -D warnings at the generated project's
#                   workspace root, instead of (in addition to, for --wire-weaver entries) an embedded cargo build.
#   note    free text ported from frameworks.md's parenthetical remarks, for the summary table only.

