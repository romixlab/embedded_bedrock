# stm32-hal2 runtime feature per series.
[hal2.rt]
C0 = "c0rt"
F3 = "f3rt"
F4 = "f4rt"
G0 = "g0rt"
G4 = "g4rt"
H5 = "h5rt"
H7 = "h7rt"
