features = ["rt"]
chips = { g030 = ["stm32g030"], g031 = ["stm32g031"], g041 = ["stm32g041"], g070 = ["stm32g070"], g071 = ["stm32g071"], g081 = ["stm32g081"] }

[xxhal.G4]
crate = "stm32g4xx-hal"
features = []  # default features include rt
defmt = true
chips = { g431 = ["stm32g431"], g441 = ["stm32g441"], g473 = ["stm32g473"], g474 = ["stm32g474"], g483 = ["stm32g483"], g484 = ["stm32g484"], g491 = ["stm32g491"], g4a1 = ["stm32g4a1"] }

[xxhal.H7]
crate = "stm32h7xx-hal"
features = []  # default features include rt
# revision V silicon (all parts shipped since 2019); H745/H755 share the H747 register map
chips = { h723 = ["stm32h735"], h725 = ["stm32h735"], h730 = ["stm32h735"], h733 = ["stm32h735"], h735 = ["stm32h735"], h742 = ["stm32h742v"], h743 = ["stm32h743v"], h745 = ["stm32h747cm7"], h747 = ["stm32h747cm7"], h750 = ["stm32h750v"], h753 = ["stm32h753v"], h755 = ["stm32h747cm7"], h757 = ["stm32h747cm7"], h7a3 = ["stm32h7a3"], h7b0 = ["stm32h7b0"], h7b3 = ["stm32h7b3"] }

