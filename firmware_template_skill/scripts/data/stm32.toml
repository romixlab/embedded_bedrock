WB = "thumbv7em-none-eabihf"
WL = "thumbv7em-none-eabihf"
WBA = "thumbv8m.main-none-eabihf"
H5 = "thumbv8m.main-none-eabihf"
L5 = "thumbv8m.main-none-eabihf"
U3 = "thumbv8m.main-none-eabihf"
U5 = "thumbv8m.main-none-eabihf"
N6 = "thumbv8m.main-none-eabihf"

