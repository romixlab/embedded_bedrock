# STM32 tables. Chip memories/registers come from embassy-rs/stm32-data-generated; this file only
# holds what stm32-data does not provide.

default_led = "PB14"

# Rust target per series (the two characters after "STM32"). A three-character key (e.g. WBA)
# takes precedence over the two-character one.
[rust_target]
C0 = "thumbv6m-none-eabi"
F0 = "thumbv6m-none-eabi"
G0 = "thumbv6m-none-eabi"
L0 = "thumbv6m-none-eabi"
U0 = "thumbv6m-none-eabi"
F1 = "thumbv7m-none-eabi"
F2 = "thumbv7m-none-eabi"
L1 = "thumbv7m-none-eabi"
F3 = "thumbv7em-none-eabihf"
F4 = "thumbv7em-none-eabihf"
F7 = "thumbv7em-none-eabihf"
G4 = "thumbv7em-none-eabihf"
H7 = "thumbv7em-none-eabihf"
L4 = "thumbv7em-none-eabihf"
WB = "thumbv7em-none-eabihf"
WL = "thumbv7em-none-eabihf"
WBA = "thumbv8m.main-none-eabihf"
H5 = "thumbv8m.main-none-eabihf"
L5 = "thumbv8m.main-none-eabihf"
U3 = "thumbv8m.main-none-eabihf"
U5 = "thumbv8m.main-none-eabihf"
N6 = "thumbv8m.main-none-eabihf"

