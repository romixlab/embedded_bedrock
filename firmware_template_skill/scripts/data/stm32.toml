WB = "wbrt"
WL = "wlrt"

# stm32-rs HALs (--framework stm32xx-hal), one crate per series; crate versions in versions.toml.
# chips: key = the four characters after "STM32", lower case -> crate features. Placeholders:
#   {size}    flash size code, lower case (STM32F303VC -> "c")
#   {density} [xxhal.<series>.density] entry for the flash size code ("" drops the feature)
#   {mcu}     "mcu-<package>" for the first stm32-data package listed in [xxhal.<series>.mcus]
# features: always added; defmt: crate has a "defmt" feature.
[xxhal.F0]
crate = "stm32f0xx-hal"
features = ["rt"]
chips = { f030 = ["stm32f030x{size}"], f031 = ["stm32f031"], f038 = ["stm32f038"], f042 = ["stm32f042"], f048 = ["stm32f048"], f051 = ["stm32f051"], f058 = ["stm32f058"], f070 = ["stm32f070x{size}"], f071 = ["stm32f071"], f072 = ["stm32f072"], f078 = ["stm32f078"], f091 = ["stm32f091"], f098 = ["stm32f098"] }

[xxhal.F1]
crate = "stm32f1xx-hal"
features = []
defmt = true
chips = { f100 = ["stm32f100", "{density}"], f101 = ["stm32f101", "{density}"], f103 = ["stm32f103", "{density}"], f105 = ["stm32f105"], f107 = ["stm32f107"] }
# low density (4, 6) has no feature
density = { "8" = "medium", b = "medium", c = "high", d = "high", e = "high", f = "xl", g = "xl" }

[xxhal.F3]
crate = "stm32f3xx-hal"
features = []  # default features include rt
chips = { f301 = ["stm32f301x{size}"], f302 = ["stm32f302x{size}"], f303 = ["stm32f303x{size}"], f318 = ["stm32f318x8"], f328 = ["stm32f328x8"], f334 = ["stm32f334x{size}"], f358 = ["stm32f358xc"], f373 = ["stm32f373x{size}"], f378 = ["stm32f378xc"], f398 = ["stm32f398xe"] }

[xxhal.F4]
crate = "stm32f4xx-hal"
features = []
defmt = true
chips = { f401 = ["stm32f401"], f405 = ["stm32f405"], f407 = ["stm32f407"], f410 = ["stm32f410"], f411 = ["stm32f411"], f412 = ["stm32f412"], f413 = ["stm32f413"], f415 = ["stm32f415"], f417 = ["stm32f417"], f423 = ["stm32f423"], f427 = ["stm32f427"], f429 = ["stm32f429"], f437 = ["stm32f437"], f439 = ["stm32f439"], f446 = ["stm32f446"], f469 = ["stm32f469"], f479 = ["stm32f479"] }

[xxhal.F7]
crate = "stm32f7xx-hal"
features = ["rt"]
chips = { f722 = ["stm32f722"], f723 = ["stm32f723"], f730 = ["stm32f730"], f732 = ["stm32f732"], f733 = ["stm32f733"], f745 = ["stm32f745"], f746 = ["stm32f746"], f756 = ["stm32f756"], f765 = ["stm32f765"], f767 = ["stm32f767"], f769 = ["stm32f769"], f777 = ["stm32f777"], f778 = ["stm32f778"], f779 = ["stm32f779"] }

[xxhal.G0]
