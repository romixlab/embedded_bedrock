# flip-link layout: the stack below .data / .bss / .uninit, small frames, no libcalls
[[section]]
name = ".vector_table"
addr = 0x0800_0000
size = 0xC0
flags = "a"

[[section]]
name = ".text"
addr = 0x0800_00C0
flags = "ax"

[[section]]
name = ".rodata"
addr = 0x0800_0400
size = 0x100
flags = "a"

[[section]]
name = ".data"
addr = 0x2000_1000
size = 0x20
flags = "aw"
load = 0x0800_0500

[[section]]
name = ".bss"
addr = 0x2000_1020
size = 0x100
flags = "aw"
nobits = true

[[section]]
name = ".uninit"
addr = 0x2000_1120
size = 0x40
flags = "aw"
nobits = true

[[function]]
name = "Reset"
addr = 0x0800_00C0
frame = 8
calls = ["main"]

[[function]]
name = "main"
addr = 0x0800_0100
frame = 64
calls = ["work"]

[[function]]
name = "work"
addr = 0x0800_0140
frame = 32

[[function]]
name = "HardFault"
addr = 0x0800_0180
frame = 8

[[symbol]]
name = "_stack_start"
addr = 0x2000_1000

[[symbol]]
name = "__sbss"
addr = 0x2000_1020

[[symbol]]
name = "__ebss"
addr = 0x2000_1120
