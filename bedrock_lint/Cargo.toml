[package]
name = "bedrock_lint"
version = "0.1.0"
edition = "2024"
description = "Firmware lint: reads a bare-metal Rust firmware crate into a model and runs the automatic checks of the firmware check catalogue"
license = "MIT"

[dependencies]
anstyle = "1"
inventory = "0.3"
object = { version = "0.38", default-features = false, features = ["read_core", "elf"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", default-features = false, features = ["full", "visit", "parsing", "printing", "clone-impls"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
