[package]
name = "bedrock_sync"
version = "0.1.0"
edition = "2024"
description = "Shared clock for bedrock firmware: a local clock disciplined onto UTC by host steer points or a sync line, holdover, scheduled actions, the ww_timebase::Clock server bookkeeping"
license = "MIT OR Apache-2.0"

# Firmware takes this crate by path from the embedded_bedrock checkout next to it, like bedrock_led: the
# `ww-timebase` feature depends on WireWeaver from the local checkout next to that, as the firmware does.

[features]
# A static shared clock on embassy-time's Instant, and wait_until_shared for scheduled actions
embassy = ["dep:embassy-time", "dep:embassy-sync"]
# The ww_timebase::Clock bookkeeping shared by boards (steer, sync_status, time_map, shared_now)
ww-timebase = ["dep:ww_timebase", "dep:wire_weaver", "dep:ww_si"]
defmt = ["dep:defmt", "ww_timebase?/defmt"]

[dependencies]
defmt = { version = "1.0", optional = true }
embassy-sync = { version = "0.8.0", optional = true }
embassy-time = { version = "0.5.1", optional = true }
wire_weaver = { workspace = true, optional = true }
ww_si = { path = "../../wire_weaver/ww_stdlib/ww_si", default-features = false, features = ["time", "u32"], optional = true }
ww_timebase = { path = "../../wire_weaver/ww_stdlib/ww_timebase", default-features = false, optional = true }
