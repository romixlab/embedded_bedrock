[package]
name = "embedded-bedrock"
version = "0.2.51"
edition = "2024"

[workspace]
members = [
    "bedrock",
    "bedrock_build",
    "bedrock_can",
    "bedrock_clocks",
    "bedrock_clocks_rt",
    "bedrock_crash",
    "bedrock_led",
    "bedrock_rom_boot",
    "bedrock_sync",
    "bedrock_usb",
    "bedrock_build_info",
    "bedrock_board",
    "bedrock_board_cli",
    "bedrock_lint",
    "bedrock_lint_cli",
    "bedrock_cli",
    "fw_registry",
]

# just install: release, but incremental so a rebuild after a small change is quick
[profile.deploy]
inherits = "release"
incremental = true

# just test: line-tables-only keeps panic locations and backtraces useful without the full type and variable
# info rustc otherwise writes for every one of the ~23 test binaries; split-debuginfo off the binary so a
# rebuild after a one-line change doesn't relink everything else's debug info into it too.
[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[workspace.dependencies]
# WireWeaver by git only, pinned to a commit by Cargo.lock: every PC builds the same thing, and the crates build when
# embedded_bedrock itself comes from git (firmware's bedrock_build, `cargo install --git ... bedrock_board_cli`).
# Bump: `cargo update -p wire_weaver`. Co-development with ../wire_weaver: `just dev-local` (AGENTS.md).
wire_weaver = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_can_bus = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_clock_sync = { git = "https://github.com/vhrdtech/wire_weaver" }
ww_date_time = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_dfu = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_indication = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_si = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_timebase = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_version = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
# exact_units by git, no rev: Cargo.lock pins the commit, the same one wire_weaver resolves, so the tree has one exact_units
exact_units = { version = "0.1.0", git = "https://github.com/romixlab/exact_units", default-features = false }

# Local development against the sibling checkout: uncomment (see also `just dev-local` and .cargo/sibling-patch.toml)
# [patch."https://github.com/romixlab/exact_units"]
# exact_units = { path = "../exact_units" }
