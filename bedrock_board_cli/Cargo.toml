[package]
name = "bedrock_board_cli"
version = "0.1.0"
edition = "2024"
description = "boardmap (board infographics from a PCB file, bedrock_board) and bedrock-board (the board description's checks, bedrock_board_model)"
license = "MIT"

[[bin]]
name = "boardmap"
path = "src/main.rs"

[[bin]]
name = "bedrock-board"
path = "src/bin/bedrock_board/main.rs"

[dependencies]
bedrock_board = { path = "../bedrock_board" }
bedrock_board_model = { path = "../bedrock_board_model" }
regex-lite = "0.1"
serde_json = "1"
anstream = "1"
anstyle = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }

[dev-dependencies]
serde_json = "1"
# chip data for the B135 tests, written in stm32-data's format from the metapac's metadata (one chip per build;
# the workspace's bedrock_clocks takes the same chip)
stm32-metapac = { version = "21.0.0", default-features = false, features = ["metadata", "stm32h725ig"] }
tempfile = "3"
