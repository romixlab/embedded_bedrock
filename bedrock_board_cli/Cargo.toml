[package]
name = "bedrock_board_cli"
version = "0.1.0"
edition = "2024"
description = "boardmap: board infographics from a PCB file and a TOML description (bedrock_board)"
license = "MIT"

[[bin]]
name = "boardmap"
path = "src/main.rs"

[dependencies]
bedrock_board = { path = "../bedrock_board" }
anstream = "1"
anstyle = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
